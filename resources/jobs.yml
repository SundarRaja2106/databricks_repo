
resources:
  jobs:
    ETL_load_job:
      name: ETL load job

      tasks:

        # -------------------------
        # BRONZE LOAD
        # -------------------------
        - task_key: bronze_load
          notebook_task:
            notebook_path: ../src/bronze_load.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}

        # -------------------------
        # SILVER LOAD
        # -------------------------
        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: ../src/silver_load.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}

        # -------------------------
        # GOLD LOAD
        # -------------------------
        - task_key: gold_load
          depends_on:
            - task_key: silver_load
          notebook_task:
            notebook_path: ../src/gold_load.py
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}

      # -------------------------
      # SERVERLESS COMPUTE
      # -------------------------
      queue:
        enabled: true
