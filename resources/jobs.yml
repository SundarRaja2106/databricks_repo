
resources:
  jobs:
    ETL_load_job:
      name: ETL load job

      tasks:
        - task_key: bronze_load
          notebook_task:
            notebook_path: ../src/bronze_load.py
            source: WORKSPACE

        - task_key: silver_load
          depends_on:
            - task_key: bronze_load
          notebook_task:
            notebook_path: ../src/silver_load.py
            source: WORKSPACE

        - task_key: gold_load
          depends_on:
            - task_key: silver_load
          notebook_task:
            notebook_path: ../src/gold_load.py
            source: WORKSPACE

      queue:
        enabled: true
